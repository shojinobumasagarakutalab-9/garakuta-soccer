<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>GARAKUTA蹴球部</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<main class="app">

  <!-- =========================================
       HERO
  ========================================== -->
  <section class="hero">

    <div class="hero-top">

      <!-- GARAKUTA蹴球部 ロゴ -->
      <img
        src="./images/garakutashukyubu-logo.png"
        class="soccer-logo"
        alt="GARAKUTA蹴球部"
      >

      <button class="menu" aria-label="メニュー">☰</button>

    </div>


    <!-- メインビジュアル -->
    <div class="hero-visual">

      <img
        src="./images/garakusarurs-resize2.png"
        class="hero-mascot"
        alt="ガラクサウルス"
      >

      <div class="hero-speech">
        サッカーの<br>
        分からない用語<br>
        <strong>オレに聞いて！</strong>
      </div>

    </div>


    <!-- 検索 -->
    <form id="searchForm" class="search">

      <div class="searchbox">

        <span class="search-icon">⌕</span>

        <input
          id="searchInput"
          type="search"
          placeholder="サッカー用語を入力してみてね！"
        >

      </div>

      <button type="submit" class="search-button">
        検索
      </button>

    </form>


    <!-- 人気ワード -->
    <div class="popular">

      <span class="popular-title">🔥 人気の用語</span>

      <button data-term="ハイプレス">
        ハイプレス
      </button>

      <button data-term="ミドルブロック">
        ミドルブロック
      </button>

      <button data-term="ビルドアップ">
        ビルドアップ
      </button>

      <button data-term="偽9番">
        偽9番
      </button>

      <button data-term="オフサイド">
        オフサイド
      </button>

    </div>

  </section>


  <!-- =========================================
       TERM ANSWER
  ========================================== -->
  <section id="answer" class="answer">

    <div class="term-card">

      <!-- 左：ガラクサウルス -->
      <div class="term-character">

        <img
          src="./images/garakusarurs.png"
          alt="ガラクサウルス"
        >

        <div class="term-speech">
          <strong id="characterMessage">ハイプレス</strong><br>
          について説明するよ！
        </div>

      </div>


      <!-- 右：説明 -->
      <article class="explanation">

        <h1 id="termTitle">
          ハイプレスとは？
        </h1>

        <p id="termLead">
          相手陣地の高い位置から積極的に
          プレッシャーをかけて、ボールを
          奪いにいく守備の戦術だよ！
        </p>

        <button
          id="voiceButton"
          class="voice"
          type="button"
        >
          🔊 ガラクサウルスの解説を聞く
        </button>

      </article>

    </div>


    <!-- =========================================
         LEVEL
    ========================================== -->

    <nav class="levels">

      <button
        class="level active easy"
        data-level="easy"
      >
        <strong>🐣 かんたん</strong>
        <small>初心者向け</small>
      </button>


      <button
        class="level normal"
        data-level="normal"
      >
        <strong>⚽ くわしく</strong>
        <small>もっと知りたい</small>
      </button>


      <button
        class="level pro"
        data-level="pro"
      >
        <strong>🧠 ガチ解説</strong>
        <small>戦術・応用</small>
      </button>

    </nav>


    <!-- =========================================
         DETAIL
    ========================================== -->

    <section class="detail">

      <!-- 左 -->
      <div class="detail-text">

        <p id="termDescription">
          相手のゴールに近い位置から、
          みんなでプレッシャーをかけて、
          相手がパスをつなぐ前に
          ボールを奪う守り方だよ！
        </p>


        <h3>💡 ポイント</h3>


        <ul id="pointList">

          <li>高い位置でボールを奪える</li>

          <li>すぐに攻撃につなげられる</li>

          <li>全員の連動が大事</li>

        </ul>

      </div>


      <!-- 右：戦術図 -->
      <div
        class="diagram"
        id="fieldDiagram"
      >

        <div class="goal">
          相手ゴール
        </div>


        <div class="enemy">

          <i></i>
          <i></i>
          <i></i>

        </div>


        <div class="arrows">

          <b>↑</b>
          <b>↑</b>
          <b>↑</b>

        </div>


        <img
          src="./images/mini-garaku-formation.png"
          class="mini-formation"
          alt="ミニガラクサウルスのフォーメーション"
        >


        <div class="press">
          前から<br>
          プレッシャー！
        </div>

      </div>

    </section>


    <!-- =========================================
         CONTENT BUTTONS
    ========================================== -->

    <div class="content-links">

      <button
        class="content-card diagram-button"
        type="button"
      >

        <span class="content-icon">📋</span>

        <span>
          <strong>図解で見る</strong>
          <small>戦術をもっと分かりやすく</small>
        </span>

        <b>›</b>

      </button>


      <button
        class="content-card video-button"
        type="button"
      >

        <span class="content-icon">▶️</span>

        <span>
          <strong>60秒でわかる</strong>
          <small>解説動画を見る</small>
        </span>

        <b>›</b>

      </button>

    </div>

  </section>


  <!-- =========================================
       RELATED
  ========================================== -->

  <section
    id="relatedSection"
    class="related-section"
  >

    <div class="related-heading">

      <strong>
        📖 関連する用語
      </strong>

      <span>
        一緒に覚えるともっとサッカーが楽しくなるよ！
      </span>

    </div>


    <div
      id="relatedTerms"
      class="related"
    >

      <button data-term="ミドルブロック">
        <span class="related-image">⚽</span>
        <strong>ミドルブロック</strong>
        <small>中盤で構える守備</small>
      </button>


      <button data-term="ローブロック">
        <span class="related-image">🥅</span>
        <strong>ローブロック</strong>
        <small>ゴール前で守る守備</small>
      </button>


      <button data-term="ゲーゲンプレス">
        <span class="related-image">🔥</span>
        <strong>ゲーゲンプレス</strong>
        <small>奪われたらすぐ奪い返す</small>
      </button>


      <button data-term="ビルドアップ">
        <span class="related-image">⚽</span>
        <strong>ビルドアップ</strong>
        <small>後ろからつないで攻める</small>
      </button>

    </div>

  </section>

</main>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script src="./js/terms.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
